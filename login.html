<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register — Sadrakshan.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
    rel="stylesheet" />

  <!-- GA4 — replace G-XXXXXXXXXX with your Measurement ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YK79G2YYBN"></script>
  <script src="analytics.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0A1628;
      --navy2: #112240;
      --saffron: #FF6B2B;
      --saffron-light: #FF8C5A;
      --white: #FFFFFF;
      --muted: #8899AA;
      --border: rgba(255, 255, 255, 0.08);
      --success: #2ECC71;
      --error: #E74C3C;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
    }

    .topbar img {
      height: 40px;
    }

    .topbar .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .topbar .brand span {
      color: var(--saffron);
    }

    /* ── MAIN LAYOUT ── */
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 40px 36px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 0 14px;
      cursor: pointer;
      transition: color 0.2s;
      position: relative;
    }

    .tab-btn.active {
      color: var(--saffron);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--saffron);
    }

    /* ── FORMS ── */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--white);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 11px 14px;
      transition: border-color 0.2s;
      outline: none;
      appearance: none;
    }

    input:focus,
    select:focus {
      border-color: var(--saffron);
      background: rgba(255, 107, 43, 0.06);
    }

    select option {
      background: var(--navy2);
    }

    input::placeholder {
      color: var(--muted);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ── BUTTON ── */
    .btn-primary {
      width: 100%;
      background: var(--saffron);
      color: var(--white);
      border: none;
      border-radius: 7px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--saffron-light);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin: 18px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .btn-google {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--white);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-google:hover {
      border-color: var(--saffron);
      background: rgba(255, 107, 43, 0.06);
    }

    .btn-google svg {
      flex-shrink: 0;
    }

    /* ── MESSAGES ── */
    .msg {
      border-radius: 7px;
      padding: 12px 16px;
      font-size: 0.9rem;
      margin-bottom: 18px;
      display: none;
    }

    .msg.success {
      background: rgba(46, 204, 113, 0.12);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: var(--success);
      display: block;
    }

    .msg.error {
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: var(--error);
      display: block;
    }

    /* ── PANEL VISIBILITY ── */
    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* ── FOOTER NOTE ── */
    .footnote {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 24px;
      line-height: 1.6;
    }

    .footnote a {
      color: var(--saffron);
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">Sadrakshan<span>.AI</span></div>
  </div>

  <!-- MAIN -->
  <div class="container">
    <div class="card">

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Register</button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="panel active" id="panel-login">
        <div class="msg" id="login-msg"></div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="Enter your password" />
        </div>
        <button class="btn-primary" id="btn-login" onclick="doLogin()">Login to Sadrakshan.AI</button>

        <div class="divider">or</div>
        <button class="btn-google" onclick="doGoogleLogin()">
          <!-- Google "G" icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- SIGNUP PANEL -->
      <div class="panel" id="panel-signup">
        <div class="msg" id="signup-msg"></div>

        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="su-name" placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="su-mobile" placeholder="10-digit number" maxlength="10" />
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="su-email" placeholder="your@email.com" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="su-pass" placeholder="Minimum 8 characters" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Designation</label>
            <select id="su-designation">
              <option value="">Select role</option>
              <option value="Police Officer">Police Officer</option>
              <option value="Senior Officer">Senior Officer</option>
              <option value="General Public">General Public</option>
              <option value="Researcher">Researcher / Academic</option>
              <option value="Journalist">Journalist / Media</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>District</label>
            <input type="text" id="su-district" placeholder="e.g. Buldhana" />
          </div>
        </div>

        <div class="form-group">
          <label>State</label>
          <input type="text" id="su-state" value="Maharashtra" />
        </div>

        <button class="btn-primary" id="btn-signup" onclick="doSignup()">Create My Account</button>

        <div class="divider">or</div>
        <button class="btn-google" onclick="doGoogleLogin()">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Register with Google
        </button>
      </div>

      <p class="footnote">
        This platform is part of <strong>Sadrakshan.AI</strong> — a Maharashtra Police initiative.<br />
        Your data is used only for platform access and official communication.<br />
        <a href="index.html">← Back to homepage</a>
      </p>
    </div>
  </div>

  <!-- FIREBASE -->
  <script type="module">
    import { auth, db, googleProvider } from "./firebase-config.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Expose functions to global scope so onclick handlers work
    window._firebaseAuth = auth;
    window._firebaseDb = db;
    window._googleProvider = googleProvider;
    window._createUser = createUserWithEmailAndPassword;
    window._signIn = signInWithEmailAndPassword;
    window._signInGoogle = signInWithPopup;
    window._doc = doc;
    window._setDoc = setDoc;
    window._serverTimestamp = serverTimestamp;

    // If already logged in, redirect
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });
  </script>

  <script>
    // ── TAB SWITCHER ──
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      if (loading) btn.textContent = 'Please wait...';
    }

    // ── LOGIN ──
    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value;
      if (!email || !pass) {
        showMsg('login-msg', 'Please enter your email and password.', 'error');
        return;
      }
      setLoading('btn-login', true);
      try {
        await window._signIn(window._firebaseAuth, email, pass);
        trackLoginSuccess('email');
        window.location.href = 'index.html';
      } catch (e) {
        let msg = 'Login failed. Please check your credentials.';
        if (e.code === 'auth/user-not-found') msg = 'No account found with this email. Please register first.';
        if (e.code === 'auth/wrong-password') msg = 'Incorrect password. Please try again.';
        showMsg('login-msg', msg, 'error');
        setLoading('btn-login', false);
        document.getElementById('btn-login').textContent = 'Login to Sadrakshan.AI';
      }
    }

    // ── SIGNUP ──
    async function doSignup() {
      const name = document.getElementById('su-name').value.trim();
      const mobile = document.getElementById('su-mobile').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const pass = document.getElementById('su-pass').value;
      const designation = document.getElementById('su-designation').value;
      const district = document.getElementById('su-district').value.trim();
      const state = document.getElementById('su-state').value.trim();

      if (!name || !email || !pass || !designation) {
        showMsg('signup-msg', 'Please fill in all required fields.', 'error');
        return;
      }
      if (pass.length < 8) {
        showMsg('signup-msg', 'Password must be at least 8 characters.', 'error');
        return;
      }

      setLoading('btn-signup', true);
      try {
        const cred = await window._createUser(window._firebaseAuth, email, pass);
        const uid = cred.user.uid;

        // Write profile to Firestore
        await window._setDoc(window._doc(window._firebaseDb, 'users', uid), {
          uid,
          fullName: name,
          email,
          mobile,
          designation,
          district,
          state,
          accountStatus: 'active',
          registeredAt: window._serverTimestamp()
        });

        trackSignupComplete(designation);
        showMsg('signup-msg', '✓ You are now registered with Sadrakshan.AI. Welcome aboard.', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      } catch (e) {
        let msg = 'Registration failed. Please try again.';
        if (e.code === 'auth/email-already-in-use') msg = 'This email is already registered. Please log in.';
        if (e.code === 'auth/invalid-email') msg = 'Please enter a valid email address.';
        showMsg('signup-msg', msg, 'error');
        setLoading('btn-signup', false);
        document.getElementById('btn-signup').textContent = 'Create My Account';
      }
    }

    // ── GOOGLE LOGIN / REGISTER ──
    async function doGoogleLogin() {
      try {
        const result = await window._signInGoogle(window._firebaseAuth, window._googleProvider);
        const user = result.user;

        // Write profile if first login (Google doesn't have designation etc.)
        await window._setDoc(window._doc(window._firebaseDb, 'users', user.uid), {
          uid: user.uid,
          fullName: user.displayName || '',
          email: user.email || '',
          mobile: '',
          designation: 'General Public',
          district: '',
          state: 'Maharashtra',
          accountStatus: 'active',
          registeredAt: window._serverTimestamp()
        }, { merge: true });  // merge:true won't overwrite existing data on repeat logins

        trackLoginSuccess('google');
        window.location.href = 'index.html';
      } catch (e) {
        alert('Google sign-in failed. Please try again or use email login.');
      }
    }

    // Expose to onclick
    window.switchTab = switchTab;
    window.doLogin = doLogin;
    window.doSignup = doSignup;
    window.doGoogleLogin = doGoogleLogin;
  </script>
</body>

</html>
