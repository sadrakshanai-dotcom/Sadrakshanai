<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

<section class="sai-newsletter" id="newsletter">
  <div class="sai-nl-inner">
    <div class="sai-nl-copy">
      <div class="sai-nl-badge">Updates</div>
      <h2 class="sai-nl-title" data-i18n="home.newsletter.title">Stay Informed</h2>
      <p class="sai-nl-desc" data-i18n="home.newsletter.desc">
        Get important updates from Sadrakshan.AI directly in your inbox.
        No spam. No marketing. Just relevant policing knowledge.
      </p>
    </div>

    <form class="sai-nl-form" id="sai-mc-form"
          action=""https://gmail.us15.list-manage.com/subscribe/post?u=ac6600b0bbc2c92513c685b35&id=4163c4fd33&f_id=00b9c2e1f0""
          method="post"
          target="_blank"
          novalidate>

      <!-- Honeypot — do not remove (anti-spam) -->
      <div style="position:absolute;left:-5000px;" aria-hidden="true">
        <input type="text" name="name="b_ac6600b0bbc2c92513c685b35_4163c4fd33"" tabindex="-1" value="" />
        <!-- Replace b_XXXXX_XXXXX with the actual honeypot field name from your Mailchimp form HTML -->
      </div>

      <div class="sai-nl-fields">
        <input
          type="text"
          name="FNAME"
          id="mc-fname"
          placeholder="First Name"
          data-i18n-placeholder="home.newsletter.fname"
          autocomplete="given-name"
          required
        />
        <input
          type="email"
          name="EMAIL"
          id="mc-email"
          placeholder="Email Address"
          data-i18n-placeholder="home.newsletter.email"
          autocomplete="email"
          required
        />
        <button type="submit" id="mc-submit" data-i18n="home.newsletter.btn">Subscribe</button>
      </div>

      <div class="sai-nl-response" id="mc-response" style="display:none;"></div>

    </form>
  </div>
</section>

<style>
.sai-newsletter {
  background: #112240;
  border-top: 1px solid rgba(255,255,255,0.08);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 56px 24px;
  font-family: 'Noto Sans', sans-serif;
}
.sai-nl-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  gap: 48px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.sai-nl-copy { flex: 1; min-width: 240px; }
.sai-nl-badge {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: rgba(255,107,43,0.15);
  color: #FF6B2B;
  padding: 4px 12px;
  border-radius: 4px;
  margin-bottom: 14px;
}
.sai-nl-title {
  font-size: 1.4rem;
  font-weight: 700;
  color: #FFFFFF;
  margin-bottom: 10px;
  line-height: 1.3;
}
.sai-nl-desc {
  color: #8899AA;
  font-size: 0.92rem;
  line-height: 1.7;
  max-width: 340px;
}
.sai-nl-form { flex: 1; min-width: 280px; }
.sai-nl-fields {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sai-nl-fields input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 7px;
  color: #FFFFFF;
  font-family: 'Noto Sans', sans-serif;
  font-size: 0.95rem;
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
.sai-nl-fields input:focus {
  border-color: #FF6B2B;
  background: rgba(255,107,43,0.06);
}
.sai-nl-fields input::placeholder { color: #8899AA; }
.sai-nl-fields button {
  background: #FF6B2B;
  border: none;
  border-radius: 7px;
  color: #FFFFFF;
  cursor: pointer;
  font-family: 'Noto Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  padding: 13px;
  transition: background 0.2s, transform 0.1s;
}
.sai-nl-fields button:hover  { background: #FF8C5A; }
.sai-nl-fields button:active { transform: scale(0.98); }
.sai-nl-fields button:disabled { opacity: 0.5; cursor: not-allowed; }
.sai-nl-response {
  margin-top: 14px;
  font-size: 0.88rem;
  padding: 10px 14px;
  border-radius: 6px;
  line-height: 1.5;
}
.sai-nl-response.success {
  background: rgba(46,204,113,0.12);
  border: 1px solid rgba(46,204,113,0.3);
  color: #2ECC71;
}
.sai-nl-response.error {
  background: rgba(231,76,60,0.12);
  border: 1px solid rgba(231,76,60,0.3);
  color: #E74C3C;
}
@media (max-width: 600px) {
  .sai-nl-inner { flex-direction: column; gap: 28px; }
  .sai-nl-desc  { max-width: 100%; }
}
</style>

<script>
(function() {
  const form   = document.getElementById('sai-mc-form');
  const btn    = document.getElementById('mc-submit');
  const resp   = document.getElementById('mc-response');

  if (!form) return;

  form.addEventListener('submit', function(e) {
    const email = document.getElementById('mc-email').value.trim();
    const fname = document.getElementById('mc-fname').value.trim();

    if (!email) {
      e.preventDefault();
      showResp('Please enter your email address.', 'error');
      return;
    }

    // Disable button, let the form submit to Mailchimp in new tab
    btn.disabled    = true;
    btn.textContent = 'Subscribing...';

    // Show success message immediately (Mailchimp opens confirmation in new tab)
    setTimeout(() => {
      btn.disabled    = false;
      btn.textContent = btn.getAttribute('data-i18n') === 'home.newsletter.btn'
        ? (typeof window.t === 'function' ? window.t('home.newsletter.btn') : 'Subscribe')
        : 'Subscribe';
      showResp(
        typeof window.t === 'function'
          ? window.t('home.newsletter.success')
          : "You're subscribed! Expect updates from Sadrakshan.AI in your inbox.",
        'success'
      );
      form.reset();

      // Fire GA4 event
      if (typeof trackNewsletterSignup === 'function') {
        trackNewsletterSignup();
      }
    }, 1200);
  });

  function showResp(msg, type) {
    resp.textContent  = msg;
    resp.className    = 'sai-nl-response ' + type;
    resp.style.display = 'block';
  }
})();
</script>
