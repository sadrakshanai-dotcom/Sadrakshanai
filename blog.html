<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — Sadrakshan.AI</title>
  <meta name="description"
    content="Read articles on good policing initiatives, investigation case studies, and public information about your rights — from Maharashtra Police." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />

  <!-- GA4 — replace G-XXXXXXXXXX -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YK79G2YYBN"></script>
  <script src="analytics.js"></script>
  <script src="i18n.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0A1628;
      --navy2: #112240;
      --navy3: #0D1E38;
      --saffron: #FF6B2B;
      --saffron-light: #FF8C5A;
      --white: #FFFFFF;
      --muted: #8899AA;
      --border: rgba(255, 255, 255, 0.08);
      --cat-good: #F59E0B;
      --cat-case: #3B82F6;
      --cat-public: #10B981;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── NAV (include nav-update.html or paste nav here) ── */
    /* See nav-update.html for full nav */

    /* ── PAGE HEADER ── */
    .page-header {
      background: var(--navy2);
      border-bottom: 1px solid var(--border);
      padding: 48px 32px 40px;
      text-align: center;
    }

    .page-header h1 {
      font-family: 'Noto Serif', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ── CONTROLS ── */
    .controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    /* Category filter tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tab:hover {
      border-color: var(--saffron);
      color: var(--white);
    }

    .filter-tab.active {
      background: var(--saffron);
      border-color: var(--saffron);
      color: var(--white);
    }

    .filter-tab[data-cat="good-work"].active {
      background: var(--cat-good);
      border-color: var(--cat-good);
    }

    .filter-tab[data-cat="case-study"].active {
      background: var(--cat-case);
      border-color: var(--cat-case);
    }

    .filter-tab[data-cat="public-article"].active {
      background: var(--cat-public);
      border-color: var(--cat-public);
    }

    /* Search bar */
    .search-wrap {
      position: relative;
      flex: 0 0 280px;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-wrap input {
      width: 100%;
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--white);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 14px 9px 38px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--saffron);
    }

    .search-wrap input::placeholder {
      color: var(--muted);
    }

    /* ── GRID ── */
    .grid {
      max-width: 1100px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* ── CARD ── */
    .card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 107, 43, 0.3);
    }

    .card-top {
      padding: 22px 22px 0;
    }

    .cat-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    .cat-good-work {
      background: rgba(245, 158, 11, 0.15);
      color: var(--cat-good);
    }

    .cat-case-study {
      background: rgba(59, 130, 246, 0.15);
      color: var(--cat-case);
    }

    .cat-public-article {
      background: rgba(16, 185, 129, 0.15);
      color: var(--cat-public);
    }

    .card h2 {
      font-family: 'Noto Serif', serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .card h2 a {
      color: var(--white);
      text-decoration: none;
      transition: color 0.2s;
    }

    .card h2 a:hover {
      color: var(--saffron);
    }

    .card-excerpt {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.65;
      padding: 0 22px;
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .card-meta strong {
      color: rgba(255, 255, 255, 0.7);
    }

    .btn-readmore {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--saffron);
      text-decoration: none;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .btn-readmore:hover {
      color: var(--saffron-light);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .empty-state svg {
      margin-bottom: 16px;
      opacity: 0.3;
    }

    /* ── PAGINATION ── */
    .pagination {
      max-width: 1100px;
      margin: 48px auto;
      padding: 0 24px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-btn:hover {
      border-color: var(--saffron);
      color: var(--white);
    }

    .page-btn.active {
      background: var(--saffron);
      border-color: var(--saffron);
      color: var(--white);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .search-wrap {
        flex: unset;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ── INCLUDE YOUR EXISTING NAV HERE ── -->
  <!-- Or paste the nav-update.html snippet -->

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1 data-i18n="blog.title">Articles</h1>
    <p>Documented policing initiatives, investigation case studies, and plain-language guides for the public.</p>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="filter-tabs">
      <button class="filter-tab active" data-cat="all" onclick="setFilter('all')"
        data-i18n="blog.filter.all">All</button>
      <button class="filter-tab" data-cat="good-work" onclick="setFilter('good-work')">🏅 <span
          data-i18n="blog.filter.good">Good Work</span></button>
      <button class="filter-tab" data-cat="case-study" onclick="setFilter('case-study')">📁 <span
          data-i18n="blog.filter.case">Case Studies</span></button>
      <button class="filter-tab" data-cat="public-article" onclick="setFilter('public-article')">📰 <span
          data-i18n="blog.filter.public">Public Articles</span></button>
    </div>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search-input" data-i18n-placeholder="blog.search" placeholder="Search by keyword..."
        oninput="applyFilters()" />
    </div>
  </div>

  <!-- POSTS GRID -->
  <div class="grid" id="posts-grid">
    <div class="empty-state">Loading articles...</div>
  </div>

  <!-- PAGINATION -->
  <div class="pagination" id="pagination"></div>

  <script>
    const POSTS_PER_PAGE = 9;
    let allPosts = [];
    let filtered = [];
    let currentPage = 1;
    let activeFilter = 'all';

    const CAT_LABELS = {
      'good-work': '🏅 Good Work',
      'case-study': '📁 Case Study',
      'public-article': '📰 Public Article'
    };

    const CAT_CLASS = {
      'good-work': 'cat-good-work',
      'case-study': 'cat-case-study',
      'public-article': 'cat-public-article'
    };

    async function loadPosts() {
      try {
        const res = await fetch('posts.json');
        allPosts = await res.json();
        applyFilters();
      } catch (e) {
        document.getElementById('posts-grid').innerHTML =
          '<div class="empty-state"><p>Could not load articles. Please refresh the page.</p></div>';
      }
    }

    function setFilter(cat) {
      activeFilter = cat;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      currentPage = 1;
      applyFilters();
    }

    function applyFilters() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const lang = (typeof getLang === 'function') ? getLang() : 'en';

      filtered = allPosts.filter(post => {
        const matchCat = activeFilter === 'all' || post.category === activeFilter;
        const matchLang = !post.language || post.language === lang || post.language === 'en';
        const matchQ = !q || post.title.toLowerCase().includes(q) ||
          (post.excerpt || '').toLowerCase().includes(q) ||
          (post.tags || []).some(t => t.toLowerCase().includes(q));
        return matchCat && matchLang && matchQ;
      });

      renderGrid();
      renderPagination();
    }

    function renderGrid() {
      const grid = document.getElementById('posts-grid');
      const start = (currentPage - 1) * POSTS_PER_PAGE;
      const page = filtered.slice(start, start + POSTS_PER_PAGE);

      if (!page.length) {
        grid.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <p data-i18n="blog.noresults">No articles match your search. Try different keywords.</p>
        </div>`;
        return;
      }

      grid.innerHTML = page.map(post => {
        const catClass = CAT_CLASS[post.category] || '';
        const catLabel = CAT_LABELS[post.category] || post.category;
        const dateStr = new Date(post.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        return `<article class="card">
          <div class="card-top">
            <span class="cat-tag ${catClass}">${catLabel}</span>
            <h2><a href="post.html?id=${encodeURIComponent(post.id)}">${esc(post.title)}</a></h2>
          </div>
          <p class="card-excerpt">${esc(post.excerpt)}</p>
          <div class="card-footer">
            <div class="card-meta">
              <strong>${esc(post.author)}</strong><br/>
              ${dateStr}
            </div>
            <a href="post.html?id=${encodeURIComponent(post.id)}" class="btn-readmore" data-i18n="blog.readmore">Read More →</a>
          </div>
        </article>`;
      }).join('');
    }

    function renderPagination() {
      const total = Math.ceil(filtered.length / POSTS_PER_PAGE);
      const pg = document.getElementById('pagination');
      if (total <= 1) { pg.innerHTML = ''; return; }

      let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} data-i18n="blog.prev">← Previous</button>`;
      for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''} data-i18n="blog.next">Next →</button>`;
      pg.innerHTML = html;
    }

    function goPage(n) {
      const total = Math.ceil(filtered.length / POSTS_PER_PAGE);
      if (n < 1 || n > total) return;
      currentPage = n;
      renderGrid();
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function esc(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Re-filter when language changes
    document.addEventListener('DOMContentLoaded', () => {
      loadPosts();
      // Patch setLang to also re-filter
      const origSetLang = window.setLang;
      if (origSetLang) {
        window.setLang = function (lang) {
          origSetLang(lang);
          if (allPosts.length) { currentPage = 1; applyFilters(); }
        };
      }
    });

    window.setFilter = setFilter;
    window.applyFilters = applyFilters;
    window.goPage = goPage;
  </script>
</body>

</html>
