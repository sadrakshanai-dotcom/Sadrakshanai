<!--
  nav-update.html — Sadrakshan.AI
  Drop-in navigation snippet.

  HOW TO USE:
  1. Paste the <nav> block below into every HTML page, replacing your existing nav.
  2. Paste the <style> block into your <head> (or into style-additions.css).
  3. Add these scripts to your <head> BEFORE </head>:
       <script src="i18n.js"></script>
       <script type="module" src="firebase-config.js"></script>
       <script type="module" src="nav-auth.js"></script>
     (nav-auth.js watches Firebase auth state and updates the nav accordingly)
  4. Replace "sadrakshanai.com" logo/brand text as needed.
-->

<!-- ══════════════════════════════════ NAV HTML ══════════════════════════════ -->
<nav class="sai-nav" id="sai-nav" role="navigation" aria-label="Main navigation">
  <div class="sai-nav-inner">

    <!-- BRAND -->
    <a href="index.html" class="sai-brand">
      Sadrakshan<span>.AI</span>
    </a>

    <!-- HAMBURGER (mobile) -->
    <button class="sai-hamburger" id="sai-hamburger" aria-label="Open menu" aria-expanded="false" onclick="toggleNav()">

    </button>

    <!-- LINKS -->
    <div class="sai-nav-links" id="sai-nav-links">

      <a href="index.html" class="sai-nav-link" data-i18n="nav.home">Home</a>

      <!-- BLOG DROPDOWN -->
      <div class="sai-dropdown">
        <button class="sai-nav-link sai-dropdown-toggle" aria-haspopup="true" aria-expanded="false" data-i18n="nav.blog">
          Articles <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="sai-dropdown-menu">
          <a href="blog.html?cat=good-work" class="sai-dropdown-item">
            <span class="sai-dd-icon">🏅</span>
            <span data-i18n="nav.blog.goodwork">Good Work by SP / Commissionerate</span>
          </a>
          <a href="blog.html?cat=case-study" class="sai-dropdown-item">
            <span class="sai-dd-icon">📁</span>
            <span data-i18n="nav.blog.casestudy">Case Studies</span>
          </a>
          <a href="blog.html?cat=public-article" class="sai-dropdown-item">
            <span class="sai-dd-icon">📰</span>
            <span data-i18n="nav.blog.public">Public Informative Articles</span>
          </a>
        </div>
      </div>

      <a href="about.html" class="sai-nav-link" data-i18n="nav.about">About</a>

      <!-- AUTH LINKS — managed by nav-auth.js -->
      <a href="login.html"  class="sai-nav-link" id="nav-login-link"  data-i18n="nav.login">Login</a>
      <div class="sai-dropdown" id="nav-account-dropdown" style="display:none;">
        <button class="sai-nav-link sai-dropdown-toggle" id="nav-user-name">
          My Account <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="sai-dropdown-menu">
          <a href="admin.html" class="sai-dropdown-item" id="nav-admin-link" style="display:none;">
            <span class="sai-dd-icon">⚙️</span>
            <span data-i18n="nav.admin">Admin Panel</span>
          </a>
          <button class="sai-dropdown-item" id="nav-logout-btn" onclick="navLogout()">
            <span class="sai-dd-icon">→</span>
            <span data-i18n="nav.logout">Logout</span>
          </button>
        </div>
      </div>

      <!-- LANGUAGE SWITCHER -->
      <div class="sai-lang-switcher">
        <button class="sai-lang-btn" data-lang-btn="mr" onclick="setLang('mr')">मराठी</button>
        <span class="sai-lang-sep">|</span>
        <button class="sai-lang-btn" data-lang-btn="hi" onclick="setLang('hi')">हिंदी</button>
        <span class="sai-lang-sep">|</span>
        <button class="sai-lang-btn active" data-lang-btn="en" onclick="setLang('en')">English</button>
      </div>

    </div>
  </div>
</nav>

<!-- ══════════════════════════════════ NAV CSS ═══════════════════════════════ -->
<!-- Paste into style-additions.css or your page <style> block -->
<style>
/* ── VARIABLES (match existing site or override) ── */
:root {
  --sai-navy:    #0A1628;
  --sai-navy2:   #112240;
  --sai-saffron: #FF6B2B;
  --sai-white:   #FFFFFF;
  --sai-muted:   #8899AA;
  --sai-border:  rgba(255,255,255,0.08);
  --sai-nav-h:   64px;
}

/* ── NAV CONTAINER ── */
.sai-nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(10,22,40,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--sai-border);
  font-family: 'Noto Sans', 'Noto Sans Devanagari', sans-serif;
}
.sai-nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: var(--sai-nav-h);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── BRAND ── */
.sai-brand {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--sai-white);
  text-decoration: none;
  letter-spacing: 0.01em;
  margin-right: 12px;
  flex-shrink: 0;
}
.sai-brand span { color: var(--sai-saffron); }

/* ── LINKS CONTAINER ── */
.sai-nav-links {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1;
  flex-wrap: wrap;
}

/* ── INDIVIDUAL LINK ── */
.sai-nav-link {
  background: none;
  border: none;
  color: var(--sai-muted);
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color 0.2s, background 0.2s;
  white-space: nowrap;
}
.sai-nav-link:hover,
.sai-nav-link.active { color: var(--sai-white); background: rgba(255,255,255,0.06); }

/* ── DROPDOWN ── */
.sai-dropdown {
  position: relative;
}
.sai-dropdown-toggle svg {
  transition: transform 0.2s;
}
.sai-dropdown:hover .sai-dropdown-toggle svg,
.sai-dropdown:focus-within .sai-dropdown-toggle svg {
  transform: rotate(180deg);
}
.sai-dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  background: var(--sai-navy2);
  border: 1px solid var(--sai-border);
  border-radius: 10px;
  padding: 6px;
  min-width: 260px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-6px);
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  z-index: 100;
}
.sai-dropdown:hover .sai-dropdown-menu,
.sai-dropdown:focus-within .sai-dropdown-menu {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.sai-dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  color: var(--sai-muted);
  font-family: inherit;
  font-size: 0.88rem;
  padding: 10px 14px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, color 0.15s;
}
.sai-dropdown-item:hover { background: rgba(255,107,43,0.1); color: var(--sai-white); }
.sai-dd-icon { flex-shrink: 0; font-size: 1em; }

/* ── LANGUAGE SWITCHER ── */
.sai-lang-switcher {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.sai-lang-btn {
  background: none;
  border: none;
  color: var(--sai-muted);
  font-family: 'Noto Sans Devanagari', 'Noto Sans', sans-serif;
  font-size: 0.82rem;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  transition: color 0.2s;
}
.sai-lang-btn:hover,
.sai-lang-btn.active { color: var(--sai-saffron); font-weight: 700; }
.sai-lang-sep { color: var(--sai-border); font-size: 0.8rem; }

/* ── HAMBURGER ── */
.sai-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  margin-left: auto;
  border-radius: 6px;
}
.sai-hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--sai-white);
  border-radius: 2px;
  transition: transform 0.25s, opacity 0.25s;
}
.sai-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.sai-hamburger.open span:nth-child(2) { opacity: 0; }
.sai-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .sai-hamburger { display: flex; }
  .sai-nav-links {
    position: fixed;
    top: var(--sai-nav-h);
    left: 0; right: 0;
    background: var(--sai-navy2);
    border-bottom: 1px solid var(--sai-border);
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 20px 24px;
    gap: 4px;
    display: none;
  }
  .sai-nav-links.open { display: flex; }
  .sai-nav-link { width: 100%; padding: 12px 14px; }
  .sai-dropdown-menu {
    position: static;
    opacity: 1;
    pointer-events: auto;
    transform: none;
    box-shadow: none;
    border: none;
    border-radius: 0;
    padding: 0 0 0 20px;
    background: transparent;
    min-width: unset;
    display: none;
  }
  .sai-dropdown:focus-within .sai-dropdown-menu { display: block; }
  .sai-lang-switcher { margin-left: 0; padding: 8px 14px; }
}
</style>

<!-- ════════════════════════════════════════════════════════════════════════════
     nav-auth.js — paste into a file called nav-auth.js and include as module
     This watches Firebase auth and updates the nav login/account state
     ════════════════════════════════════════════════════════════════════════════ -->
<!--
SAVE THIS AS nav-auth.js and include in every page:
<script type="module" src="nav-auth.js"></script>

─────────────────────────────────────────────────────────
import { auth, ADMIN_UID } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  const loginLink   = document.getElementById('nav-login-link');
  const accountDD   = document.getElementById('nav-account-dropdown');
  const userNameBtn = document.getElementById('nav-user-name');
  const adminLink   = document.getElementById('nav-admin-link');

  if (user) {
    if (loginLink)   loginLink.style.display   = 'none';
    if (accountDD)   accountDD.style.display   = '';
    if (userNameBtn) userNameBtn.innerHTML      =
      `${user.displayName || user.email.split('@')[0]}
       <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>`;
    if (adminLink && user.uid === ADMIN_UID) adminLink.style.display = '';
  } else {
    if (loginLink)   loginLink.style.display   = '';
    if (accountDD)   accountDD.style.display   = 'none';
  }
});

window.navLogout = async function() {
  await signOut(auth);
  window.location.href = 'index.html';
};
─────────────────────────────────────────────────────────
-->

<script>
// Mobile nav toggle
function toggleNav() {
  const btn   = document.getElementById('sai-hamburger');
  const links = document.getElementById('sai-nav-links');
  const open  = links.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
}

// Handle blog category param from URL
document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  const cat    = params.get('cat');
  if (cat && typeof window.setFilter === 'function') {
    window.setFilter(cat);
  }
});

window.toggleNav = toggleNav;
</script>
